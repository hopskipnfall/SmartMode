name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libcurl4-openssl-dev libxml2-dev
      - name: Unit tests
        run: swift test
      - name: Build Debian package
        # The Swift runtime is linked in, so the package only needs GTK, AppIndicator, curl and libxml2.
        run: ./scripts/build-deb.sh --static-swift-stdlib
      - name: Lint package
        run: |
          sudo apt-get install -y lintian desktop-file-utils
          lintian --fail-on error --tag-display-limit 0 smart-mode_*.deb
      - name: Install package
        run: |
          sudo apt-get install -y ./smart-mode_*.deb
          test -x /usr/bin/smart-mode
          desktop-file-validate /usr/share/applications/smart-mode.desktop
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SmartMode-linux-${{ github.sha }}
          path: smart-mode_*.deb
          if-no-files-found: error
          retention-days: 30

  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip app bundle
        # ditto keeps the bundle's structure and signature intact, unlike plain zip.
        run: ditto -c -k --keepParent SmartMode.app SmartMode.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SmartMode-${{ github.sha }}
          path: SmartMode.zip
          if-no-files-found: error
          retention-days: 30
