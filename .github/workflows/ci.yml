name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip app bundle
        # ditto keeps the bundle's structure and signature intact, unlike plain zip.
        run: ditto -c -k --keepParent SmartMode.app SmartMode.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SmartMode-${{ github.sha }}
          path: SmartMode.zip
          if-no-files-found: error
          retention-days: 30
