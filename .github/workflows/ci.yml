name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libcurl4-openssl-dev libxml2-dev
      - name: Unit tests
        run: swift test
      - name: Build
        # The Swift runtime is linked in, so the binary only needs GTK, AppIndicator, curl and libxml2 installed.
        run: swift build -c release --product SmartModeLinux --static-swift-stdlib
      - name: Package binary
        # tar keeps the executable bit, which an artifact zip would drop.
        run: tar -czf SmartMode-linux-${{ runner.arch }}.tar.gz -C .build/release SmartModeLinux
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: SmartMode-linux-${{ github.sha }}
          path: SmartMode-linux-${{ runner.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE
      - name: Unit tests
        run: swift test
      - name: Build
        run: swift build -c release --product SmartModeWindows
      - name: Bundle the Swift runtime
        # A normal PC has no Swift runtime, and static linking isn't reliable on Windows, so the
        # exe ships with the DLLs it imports (the Swift runtime, Foundation, and what they load).
        shell: pwsh
        run: |
          $bin = (swift build -c release --product SmartModeWindows --show-bin-path).Trim()
          $runtime = Split-Path (Get-Command swiftCore.dll).Source
          Write-Host "Swift runtime: $runtime"
          New-Item -ItemType Directory -Path SmartMode | Out-Null
          Copy-Item "$bin\SmartModeWindows.exe" SmartMode\
          Get-ChildItem $runtime -Filter *.dll | ForEach-Object {
            if ($_.Name -match '^(swift|Foundation|_Foundation|BlocksRuntime|dispatch|lib|zlib)') { Copy-Item $_.FullName SmartMode\ }
          }
          Copy-Item "$env:SystemRoot\System32\vcruntime140.dll" SmartMode\
          Get-ChildItem SmartMode | Format-Table Name, Length
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SmartMode-windows-${{ github.sha }}
          path: SmartMode
          if-no-files-found: error
          retention-days: 30

  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip app bundle
        # ditto keeps the bundle's structure and signature intact, unlike plain zip.
        run: ditto -c -k --keepParent SmartMode.app SmartMode.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SmartMode-${{ github.sha }}
          path: SmartMode.zip
          if-no-files-found: error
          retention-days: 30
